version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # raise the ^n.n.n constraint in composer.json, not only the lock
    versioning-strategy: increase
    groups:
      composer:
        patterns: ["*"]
