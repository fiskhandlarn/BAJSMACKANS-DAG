name: Daily

on:
  schedule:
    # off the full hour, when GitHub delays or drops scheduled runs
    - cron: '45 7 * * *'
      timezone: Europe/Stockholm
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    # a normal run takes under a minute; fail fast instead of the 6 h default
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Post today's and tomorrow's days to Slack
        run: |
          : "${WEBHOOK_URL:?WEBHOOK_URL secret missing}"
          composer install --no-dev --no-interaction --no-progress
          php index.php
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
