name: Daily

on:
  schedule:
    - cron: '0 6 * * *' # 08:00 CEST (summer)
    - cron: '0 7 * * *' # 08:00 CET (winter)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          # cron is UTC; skip the trigger that isn't 08:00 in Stockholm today
          case "$SCHEDULE/$(TZ=Europe/Stockholm date +%Z)" in '0 6 * * */CET'|'0 7 * * */CEST') exit 0;; esac
          : "${WEBHOOK_URL:?WEBHOOK_URL secret missing}"
          printf 'WEBHOOK_URL=%s\nDATA_JSON=days.json\n' "$WEBHOOK_URL" > .env
          composer install --no-dev --no-interaction --no-progress
          php index.php
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SCHEDULE: ${{ github.event.schedule }}
